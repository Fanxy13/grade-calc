<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ein einfacher Notenrechner für verschiedene Länder.">
  <title>Notenrechner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div>
        <h1>Notenrechner</h1>
      </div>

      <label class="country">
        <span>Land</span>
        <select id="countrySelect"></select>
      </label>
    </header>

    <section class="calculator card">
      <div class="section-head">
        <h2>Noten</h2>
        <button id="clearAll" class="text-button" type="button">Alle löschen</button>
      </div>

      <div id="gradeList"></div>

      <button id="addGrade" class="add-button" type="button">+ Note hinzufügen</button>

      <div class="result">
        <span>Durchschnitt</span>
        <strong id="average">–</strong>
      </div>
    </section>

    <section class="history card">
      <div class="section-head">
        <h2>Gespeicherte Noten</h2>
        <span id="savedCount">0</span>
      </div>
      <div id="historyList" class="history-list"></div>
    </section>

    <footer>Die Daten bleiben auf diesem Gerät gespeichert.</footer>

  <a class="github-link" href="https://github.com/Fanxy13" target="_blank" rel="noopener noreferrer" aria-label="GitHub Profil">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M12 .5a12 12 0 0 0-3.79 23.39c.6.11.82-.26.82-.58v-2.04c-3.34.73-4.04-1.61-4.04-1.61-.55-1.4-1.34-1.77-1.34-1.77-1.09-.75.08-.74.08-.74 1.2.08 1.84 1.23 1.84 1.23 1.07 1.83 2.8 1.3 3.49.99.11-.78.42-1.3.76-1.6-2.67-.3-5.47-1.34-5.47-5.94 0-1.31.47-2.38 1.23-3.22-.12-.3-.53-1.52.12-3.17 0 0 1-.32 3.3 1.23a11.5 11.5 0 0 1 6 0c2.3-1.55 3.3-1.23 3.3-1.23.65 1.65.24 2.87.12 3.17.76.84 1.23 1.91 1.23 3.22 0 4.61-2.8 5.63-5.48 5.93.43.37.81 1.1.81 2.22v3.29c0 .32.22.7.83.58A12 12 0 0 0 12 .5Z"/>
    </svg>
  </a>
  </main>

  <template id="gradeTemplate">
    <div class="grade-row">
      <input class="grade-input" type="number" step="0.1" inputmode="decimal" placeholder="Note">
      <input class="weight-input" type="number" step="0.1" min="0.1" value="1" inputmode="decimal" placeholder="Gewicht">
      <button class="remove-button" type="button" aria-label="Note löschen">×</button>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
